apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    uid: timescale
    url: timescale:5432
    # Read-only role with SELECT on sensor_readings only. Never the orc
    # superuser: anyone who can reach Grafana's query API can run any SQL the
    # datasource role can.
    user: orc_grafana_ro
    secureJsonData:
      password: $GRAFANA_RO_PASSWORD
    jsonData:
      database: orc
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: false
