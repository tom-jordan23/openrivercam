<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 308" width="468" height="308" role="img" aria-labelledby="figtitle figdesc" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif"><title id="figtitle">Two configurations of the same design</title><desc id="figdesc">Side-by-side comparison. On the left, the configuration as built: camera, computer, modem and power system all sit in an enclosure at the riverbank, so all of it is exposed to heat, humidity and dust and service means opening the enclosure on site. On the right, the configuration proposed for the pilot units: only the camera stays at the river, and the computer runs indoors at a BHLK or IPB facility over a network link, where temperature, humidity, dust and access are controlled. The right-hand configuration is designed but has not been field tested.</desc><rect width="100%" height="100%" fill="#ffffff"/><defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#fdeae1"/><line x1="0" y1="0" x2="0" y2="4" stroke="#eb6834" stroke-width="1.6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#52514e"/></marker></defs><text x="0.00" y="14.00" font-size="10.0" fill="#0b0b0b" text-anchor="start" font-weight="bold">Figure 4  Two configurations of the same design</text><text x="0.00" y="28.00" font-size="8.0" fill="#52514e" text-anchor="start" font-weight="normal">Recommendation R8. The right-hand configuration is designed but not yet field tested.</text><rect x="0.00" y="48.00" width="222.00" height="34.00" rx="3.0" fill="#f4f3f0" stroke="none" stroke-width="1.00"/><text x="10.00" y="62.00" font-size="8.5" fill="#0b0b0b" text-anchor="start" font-weight="bold">As built at Sukabumi</text><text x="10.00" y="75.00" font-size="7.2" fill="#52514e" text-anchor="start" font-weight="normal">Everything at the river</text><rect x="246.00" y="48.00" width="222.00" height="34.00" rx="3.0" fill="#e5eefb" stroke="none" stroke-width="1.00"/><text x="256.00" y="62.00" font-size="8.5" fill="#0b0b0b" text-anchor="start" font-weight="bold">Proposed for the pilot units</text><text x="256.00" y="75.00" font-size="7.2" fill="#52514e" text-anchor="start" font-weight="normal">Camera at the river, computer indoors</text><rect x="0.00" y="90.00" width="222.00" height="126.00" rx="3.0" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.00"/><text x="10.00" y="105.00" font-size="7.4" fill="#0b0b0b" text-anchor="start" font-weight="bold">At the riverbank</text><rect x="10.00" y="115.00" width="202.00" height="17.00" rx="2.0" fill="#f4f3f0" stroke="none" stroke-width="1.00"/><text x="16.00" y="126.00" font-size="6.9" fill="#0b0b0b" text-anchor="start" font-weight="normal">Camera</text><rect x="10.00" y="138.00" width="202.00" height="17.00" rx="2.0" fill="#f4f3f0" stroke="none" stroke-width="1.00"/><text x="16.00" y="149.00" font-size="6.9" fill="#0b0b0b" text-anchor="start" font-weight="normal">Station computer</text><rect x="10.00" y="161.00" width="202.00" height="17.00" rx="2.0" fill="#f4f3f0" stroke="none" stroke-width="1.00"/><text x="16.00" y="172.00" font-size="6.9" fill="#0b0b0b" text-anchor="start" font-weight="normal">Modem</text><rect x="10.00" y="184.00" width="202.00" height="17.00" rx="2.0" fill="#f4f3f0" stroke="none" stroke-width="1.00"/><text x="16.00" y="195.00" font-size="6.9" fill="#0b0b0b" text-anchor="start" font-weight="normal">Solar panel, battery and charge controller</text><rect x="246.00" y="90.00" width="222.00" height="46.00" rx="3.0" fill="#ffffff" stroke="#2a78d6" stroke-width="1.00"/><text x="256.00" y="106.00" font-size="7.4" fill="#0b0b0b" text-anchor="start" font-weight="bold">At the riverbank</text><text x="256.00" y="120.00" font-size="6.9" fill="#52514e" text-anchor="start" font-weight="normal">Camera only, on a network path.</text><line x1="270.00" y1="138.00" x2="270.00" y2="152.00" stroke="#52514e" stroke-width="1.10"/><path d="M 270.0 152.0 l -3.2 -5 l 6.4 0 z" fill="#52514e"/><text x="278.00" y="149.00" font-size="6.8" fill="#898781" text-anchor="start" font-weight="normal">network link</text><rect x="246.00" y="154.00" width="222.00" height="46.00" rx="3.0" fill="#e5eefb" stroke="#2a78d6" stroke-width="1.00"/><text x="256.00" y="170.00" font-size="7.4" fill="#0b0b0b" text-anchor="start" font-weight="bold">Indoors, at a BHLK or IPB facility</text><text x="256.00" y="184.00" font-size="6.9" fill="#52514e" text-anchor="start" font-weight="normal">Station computer, on mains power.</text><rect x="0.00" y="228.00" width="222.00" height="34.00" rx="3.0" fill="#ffffff" stroke="#c3c2b7" stroke-width="0.90"/><text x="10.00" y="242.00" font-size="7.0" fill="#0b0b0b" text-anchor="start" font-weight="normal">All of it is in the weather. Service means opening the</text><text x="10.00" y="252.00" font-size="7.0" fill="#0b0b0b" text-anchor="start" font-weight="normal">enclosure on site.</text><rect x="246.00" y="228.00" width="222.00" height="34.00" rx="3.0" fill="#ffffff" stroke="#2a78d6" stroke-width="0.90"/><text x="256.00" y="242.00" font-size="7.0" fill="#0b0b0b" text-anchor="start" font-weight="normal">Only the camera is in the weather. The computer sits at</text><text x="256.00" y="252.00" font-size="7.0" fill="#0b0b0b" text-anchor="start" font-weight="normal">a desk.</text><rect x="0.00" y="274.00" width="468.00" height="26.00" rx="3.0" fill="#f4f3f0" stroke="none" stroke-width="1.00"/><text x="10.00" y="290.00" font-size="7.2" fill="#0b0b0b" text-anchor="start" font-weight="normal">Site permission asked for: an enclosure, a battery, a modem and a pole  —  against a camera and a network path.</text></svg>
