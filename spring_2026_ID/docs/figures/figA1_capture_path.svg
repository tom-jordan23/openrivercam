<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 282" width="468" height="282" role="img" aria-labelledby="figtitle figdesc" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif"><title id="figtitle">The capture path: intended against implemented</title><desc id="figdesc">Two paths compared. The intended path had the camera record to its own card at full bitrate and the station pull the finished file over Ethernet faster than real time; the single interface call that needs is absent from the rebranded firmware, so the path is blocked. The implemented path pulls a live stream instead, which carries 10 to 20 per cent transport overhead. A bar chart compares the three bitrates: 20 Mbps recommended by the processing chain, 16 Mbps configured on the camera, and about 15.5 Mbps actually delivered.</desc><rect width="100%" height="100%" fill="#ffffff"/><defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#fdeae1"/><line x1="0" y1="0" x2="0" y2="4" stroke="#eb6834" stroke-width="1.6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#52514e"/></marker></defs><text x="0.00" y="14.00" font-size="10.0" fill="#0b0b0b" text-anchor="start" font-weight="bold">Figure A1  The capture path: intended against implemented</text><text x="0.00" y="28.00" font-size="8.0" fill="#52514e" text-anchor="start" font-weight="normal">The limitation is in the firmware, not in the optics or the sensor.</text><text x="0.00" y="44.00" font-size="7.8" fill="#0b0b0b" text-anchor="start" font-weight="bold">Intended — record to card, then pull the file</text><rect x="0.00" y="54.00" width="136.00" height="40.00" rx="3.0" fill="#ffffff" stroke="#2a78d6" stroke-width="1.10"/><text x="8.00" y="69.00" font-size="7.4" fill="#0b0b0b" text-anchor="start" font-weight="bold">Camera records</text><text x="8.00" y="80.00" font-size="6.7" fill="#52514e" text-anchor="start" font-weight="normal">to its own card at full bitrate</text><rect x="166.00" y="54.00" width="136.00" height="40.00" rx="3.0" fill="#fdeae1" stroke="#eb6834" stroke-width="1.10"/><text x="174.00" y="69.00" font-size="7.4" fill="#0b0b0b" text-anchor="start" font-weight="bold">Station pulls the file</text><text x="174.00" y="80.00" font-size="6.7" fill="#52514e" text-anchor="start" font-weight="normal">over Ethernet, faster than real</text><text x="174.00" y="89.00" font-size="6.7" fill="#52514e" text-anchor="start" font-weight="normal">time</text><rect x="332.00" y="54.00" width="136.00" height="40.00" rx="3.0" fill="#ffffff" stroke="#2a78d6" stroke-width="1.10"/><text x="340.00" y="69.00" font-size="7.4" fill="#0b0b0b" text-anchor="start" font-weight="bold">20 Mbps to disk</text><text x="340.00" y="80.00" font-size="6.7" fill="#52514e" text-anchor="start" font-weight="normal">no transport overhead</text><line x1="140.00" y1="74.00" x2="158.00" y2="74.00" stroke="#52514e" stroke-width="1.10"/><path d="M 162.0 74.0 l -5 -3.2 l 0 6.4 z" fill="#52514e"/><line x1="306.00" y1="74.00" x2="324.00" y2="74.00" stroke="#52514e" stroke-width="1.10"/><path d="M 328.0 74.0 l -5 -3.2 l 0 6.4 z" fill="#52514e"/><path d="M 286.0 60.0 l 10.0 10.0 M 296.0 60.0 l -10.0 10.0" stroke="#eb6834" stroke-width="2.2" stroke-linecap="round"/><text x="166.00" y="108.00" font-size="6.9" fill="#eb6834" text-anchor="start" font-weight="bold">Blocked: the one interface call this needs is absent from the rebranded</text><text x="166.00" y="117.50" font-size="6.9" fill="#eb6834" text-anchor="start" font-weight="bold">firmware.</text><text x="0.00" y="128.00" font-size="7.8" fill="#0b0b0b" text-anchor="start" font-weight="bold">Implemented — pull a live stream</text><rect x="0.00" y="138.00" width="136.00" height="40.00" rx="3.0" fill="#ffffff" stroke="#2a78d6" stroke-width="1.10"/><text x="8.00" y="153.00" font-size="7.4" fill="#0b0b0b" text-anchor="start" font-weight="bold">Camera streams</text><text x="8.00" y="164.00" font-size="6.7" fill="#52514e" text-anchor="start" font-weight="normal">live, 16 Mbps configured</text><rect x="166.00" y="138.00" width="136.00" height="40.00" rx="3.0" fill="#ffffff" stroke="#2a78d6" stroke-width="1.10"/><text x="174.00" y="153.00" font-size="7.4" fill="#0b0b0b" text-anchor="start" font-weight="bold">Transport overhead</text><text x="174.00" y="164.00" font-size="6.7" fill="#52514e" text-anchor="start" font-weight="normal">10–20% of the configured rate</text><rect x="332.00" y="138.00" width="136.00" height="40.00" rx="3.0" fill="#ffffff" stroke="#2a78d6" stroke-width="1.10"/><text x="340.00" y="153.00" font-size="7.4" fill="#0b0b0b" text-anchor="start" font-weight="bold">15.5 Mbps to disk</text><text x="340.00" y="164.00" font-size="6.7" fill="#52514e" text-anchor="start" font-weight="normal">against 20 Mbps recommended</text><line x1="140.00" y1="158.00" x2="158.00" y2="158.00" stroke="#52514e" stroke-width="1.10"/><path d="M 162.0 158.0 l -5 -3.2 l 0 6.4 z" fill="#52514e"/><line x1="306.00" y1="158.00" x2="324.00" y2="158.00" stroke="#52514e" stroke-width="1.10"/><path d="M 328.0 158.0 l -5 -3.2 l 0 6.4 z" fill="#52514e"/><line x1="0.00" y1="192.00" x2="468.00" y2="192.00" stroke="#e1e0d9" stroke-width="0.80"/><text x="0.00" y="204.00" font-size="7.6" fill="#0b0b0b" text-anchor="start" font-weight="bold">Delivered bitrate</text><text x="0.00" y="220.00" font-size="6.9" fill="#52514e" text-anchor="start" font-weight="normal">Recommended by the processing chain</text><rect x="160.00" y="212.00" width="246.00" height="11.00" rx="2.0" fill="#898781" stroke="none" stroke-width="1.00"/><text x="411.00" y="220.50" font-size="6.9" fill="#0b0b0b" text-anchor="start" font-weight="normal">20.0 Mbps</text><text x="0.00" y="237.00" font-size="6.9" fill="#52514e" text-anchor="start" font-weight="normal">Configured on the camera</text><rect x="160.00" y="229.00" width="196.80" height="11.00" rx="2.0" fill="#898781" stroke="none" stroke-width="1.00"/><text x="361.80" y="237.50" font-size="6.9" fill="#0b0b0b" text-anchor="start" font-weight="normal">16.0 Mbps</text><text x="0.00" y="254.00" font-size="6.9" fill="#52514e" text-anchor="start" font-weight="normal">Actually delivered</text><rect x="160.00" y="246.00" width="190.65" height="11.00" rx="2.0" fill="#2a78d6" stroke="none" stroke-width="1.00"/><text x="355.65" y="254.50" font-size="6.9" fill="#0b0b0b" text-anchor="start" font-weight="bold">15.5 Mbps</text></svg>
