<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 246" width="468" height="246" role="img" aria-labelledby="figtitle figdesc" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif"><title id="figtitle">How a measurement is made</title><desc id="figdesc">Flow diagram in three stages. A camera on a pole at the river sends video to a station computer, which works out a water level and a discharge figure. Both, and the video, travel over the mobile network to a central server that keeps the record. Three things the station computer depends on are shown beneath it: a solar panel and battery, a scheduler that wakes it every 30 minutes, and a rain gauge that keeps recording while the station sleeps. A note under the camera records that 30 to 60 seconds of every wake is spent waiting for the camera to boot, before any video exists.</desc><rect width="100%" height="100%" fill="#ffffff"/><defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#fdeae1"/><line x1="0" y1="0" x2="0" y2="4" stroke="#eb6834" stroke-width="1.6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#52514e"/></marker></defs><text x="0.00" y="14.00" font-size="10.0" fill="#0b0b0b" text-anchor="start" font-weight="bold">Figure 1  How a measurement is made</text><text x="0.00" y="28.00" font-size="8.0" fill="#52514e" text-anchor="start" font-weight="normal">The path a single five-second video takes, from the river to the record.</text><rect x="0.00" y="46.00" width="128.00" height="66.00" rx="3.0" fill="#ffffff" stroke="#2a78d6" stroke-width="1.20"/><rect x="0.00" y="46.00" width="128.00" height="3.00" rx="1.5" fill="#2a78d6" stroke="none" stroke-width="1.00"/><text x="64.00" y="66.00" font-size="8.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Camera</text><text x="64.00" y="79.00" font-size="7.2" fill="#52514e" text-anchor="middle" font-weight="normal">On a pole, viewing the river</text><text x="64.00" y="88.72" font-size="7.2" fill="#52514e" text-anchor="middle" font-weight="normal">section</text><rect x="170.00" y="46.00" width="128.00" height="66.00" rx="3.0" fill="#ffffff" stroke="#2a78d6" stroke-width="1.20"/><rect x="170.00" y="46.00" width="128.00" height="3.00" rx="1.5" fill="#2a78d6" stroke="none" stroke-width="1.00"/><text x="234.00" y="66.00" font-size="8.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Station computer</text><text x="234.00" y="79.00" font-size="7.2" fill="#52514e" text-anchor="middle" font-weight="normal">Works out water level and</text><text x="234.00" y="88.72" font-size="7.2" fill="#52514e" text-anchor="middle" font-weight="normal">discharge from the video</text><rect x="340.00" y="46.00" width="128.00" height="66.00" rx="3.0" fill="#ffffff" stroke="#2a78d6" stroke-width="1.20"/><rect x="340.00" y="46.00" width="128.00" height="3.00" rx="1.5" fill="#2a78d6" stroke="none" stroke-width="1.00"/><text x="404.00" y="66.00" font-size="8.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Central server</text><text x="404.00" y="79.00" font-size="7.2" fill="#52514e" text-anchor="middle" font-weight="normal">Keeps the video and the</text><text x="404.00" y="88.72" font-size="7.2" fill="#52514e" text-anchor="middle" font-weight="normal">measurement record</text><line x1="134.00" y1="79.00" x2="160.00" y2="79.00" stroke="#52514e" stroke-width="1.10"/><path d="M 164.0 79.0 l -5 -3.2 l 0 6.4 z" fill="#52514e"/><text x="149.00" y="73.00" font-size="7.0" fill="#898781" text-anchor="middle" font-weight="normal">video</text><line x1="304.00" y1="79.00" x2="330.00" y2="79.00" stroke="#52514e" stroke-width="1.10"/><path d="M 334.0 79.0 l -5 -3.2 l 0 6.4 z" fill="#52514e"/><text x="319.00" y="73.00" font-size="7.0" fill="#898781" text-anchor="middle" font-weight="normal">LTE</text><rect x="0.00" y="124.00" width="128.00" height="42.00" rx="3.0" fill="#ffffff" stroke="#eb6834" stroke-width="1.10"/><text x="7.00" y="136.00" font-size="6.9" fill="#0b0b0b" text-anchor="start" font-weight="normal">30–60 s of every wake is spent</text><text x="7.00" y="145.50" font-size="6.9" fill="#0b0b0b" text-anchor="start" font-weight="normal">booting the camera, before any</text><text x="7.00" y="155.00" font-size="6.9" fill="#0b0b0b" text-anchor="start" font-weight="normal">video exists.</text><line x1="234.00" y1="112.00" x2="234.00" y2="152.00" stroke="#898781" stroke-width="0.90" stroke-dasharray="3 2"/><text x="234.00" y="162.00" font-size="7.0" fill="#898781" text-anchor="middle" font-weight="normal">depends on</text><rect x="0.00" y="168.00" width="150.00" height="40.00" rx="3.0" fill="#f4f3f0" stroke="none" stroke-width="1.00"/><text x="10.00" y="182.00" font-size="7.6" fill="#0b0b0b" text-anchor="start" font-weight="bold">Solar panel and battery</text><text x="10.00" y="193.00" font-size="7.0" fill="#52514e" text-anchor="start" font-weight="normal">200 W of panel and a 50 Ah battery</text><text x="10.00" y="202.45" font-size="7.0" fill="#52514e" text-anchor="start" font-weight="normal">at Sukabumi.</text><rect x="159.00" y="168.00" width="150.00" height="40.00" rx="3.0" fill="#f4f3f0" stroke="none" stroke-width="1.00"/><text x="169.00" y="182.00" font-size="7.6" fill="#0b0b0b" text-anchor="start" font-weight="bold">Scheduler</text><text x="169.00" y="193.00" font-size="7.0" fill="#52514e" text-anchor="start" font-weight="normal">Wakes the station every 30 minutes,</text><text x="169.00" y="202.45" font-size="7.0" fill="#52514e" text-anchor="start" font-weight="normal">then powers it down.</text><rect x="318.00" y="168.00" width="150.00" height="40.00" rx="3.0" fill="#f4f3f0" stroke="none" stroke-width="1.00"/><text x="328.00" y="182.00" font-size="7.6" fill="#0b0b0b" text-anchor="start" font-weight="bold">Rain gauge</text><text x="328.00" y="193.00" font-size="7.0" fill="#52514e" text-anchor="start" font-weight="normal">Keeps recording rainfall while the</text><text x="328.00" y="202.45" font-size="7.0" fill="#52514e" text-anchor="start" font-weight="normal">station sleeps.</text><rect x="0.00" y="224.00" width="468.00" height="26.00" rx="3.0" fill="#e5eefb" stroke="none" stroke-width="1.00"/><text x="10.00" y="240.00" font-size="7.4" fill="#0b0b0b" text-anchor="start" font-weight="normal">The station is awake about two minutes in every thirty. Everything above happens inside that window.</text></svg>
