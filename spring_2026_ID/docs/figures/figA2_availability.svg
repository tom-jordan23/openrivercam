<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 322" width="468" height="322" role="img" aria-labelledby="figtitle figdesc" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif"><title id="figtitle">The availability record, 16 April to 28 August 2026</title><desc id="figdesc">Two panels. The upper panel is a timeline of the 133.5-day observation window with each of the 13 interruptions drawn to its true length; nine coincide with maintenance mode and four do not. The lower panel places the same 13 on a logarithmic duration scale: nine fall under 24 hours, one at 38 hours, none at all between 2 and 5 days, and three at 5 days and over. The empty band between 2 and 5 days is the signature of a latch: a missed wake either recovers within a day or persists until something external restarts the station.</desc><rect width="100%" height="100%" fill="#ffffff"/><defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#fdeae1"/><line x1="0" y1="0" x2="0" y2="4" stroke="#eb6834" stroke-width="1.6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#52514e"/></marker></defs><text x="0.00" y="14.00" font-size="10.0" fill="#0b0b0b" text-anchor="start" font-weight="bold">Figure A2  The availability record, 16 April to 28 August 2026</text><text x="0.00" y="28.00" font-size="8.0" fill="#52514e" text-anchor="start" font-weight="normal">13 interruptions across 133.5 days observed. The gap in the lower panel is the finding.</text><rect x="0.00" y="35.00" width="9.00" height="9.00" rx="1.5" fill="#2a78d6" stroke="none" stroke-width="1.00"/><text x="13.00" y="42.00" font-size="7.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">Coincides with maintenance mode  (9)</text><rect x="200.00" y="35.00" width="9.00" height="9.00" rx="1.5" fill="url(#hatch)" stroke="#eb6834" stroke-width="0.90"/><text x="213.00" y="42.00" font-size="7.5" fill="#0b0b0b" text-anchor="start" font-weight="normal">Not associated  (4)</text><text x="0.00" y="64.00" font-size="9.0" fill="#0b0b0b" text-anchor="start" font-weight="bold">A</text><text x="11.00" y="64.00" font-size="9.0" fill="#0b0b0b" text-anchor="start" font-weight="bold">Timeline — each interruption drawn to length</text><text x="468.00" y="64.00" font-size="7.2" fill="#52514e" text-anchor="end" font-weight="normal">Bars mark when the station was not running.</text><rect x="8.00" y="78.00" width="434.00" height="32.00" rx="2.0" fill="#f4f3f0" stroke="none" stroke-width="1.00"/><line x1="8.00" y1="78.00" x2="8.00" y2="113.00" stroke="#c3c2b7" stroke-width="0.70"/><text x="8.00" y="123.00" font-size="6.8" fill="#898781" text-anchor="start" font-weight="normal">16 Apr</text><line x1="56.58" y1="78.00" x2="56.58" y2="113.00" stroke="#c3c2b7" stroke-width="0.70"/><text x="56.58" y="123.00" font-size="6.8" fill="#898781" text-anchor="middle" font-weight="normal">1 May</text><line x1="156.99" y1="78.00" x2="156.99" y2="113.00" stroke="#c3c2b7" stroke-width="0.70"/><text x="156.99" y="123.00" font-size="6.8" fill="#898781" text-anchor="middle" font-weight="normal">1 Jun</text><line x1="254.15" y1="78.00" x2="254.15" y2="113.00" stroke="#c3c2b7" stroke-width="0.70"/><text x="254.15" y="123.00" font-size="6.8" fill="#898781" text-anchor="middle" font-weight="normal">1 Jul</text><line x1="354.55" y1="78.00" x2="354.55" y2="113.00" stroke="#c3c2b7" stroke-width="0.70"/><text x="354.55" y="123.00" font-size="6.8" fill="#898781" text-anchor="middle" font-weight="normal">1 Aug</text><line x1="442.00" y1="78.00" x2="442.00" y2="113.00" stroke="#c3c2b7" stroke-width="0.70"/><text x="442.00" y="123.00" font-size="6.8" fill="#898781" text-anchor="end" font-weight="normal">28 Aug</text><rect x="12.11" y="81.00" width="1.60" height="26.00" rx="1.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="0.80"/><rect x="13.28" y="81.00" width="1.60" height="26.00" rx="1.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="0.80"/><rect x="16.03" y="81.00" width="1.60" height="26.00" rx="1.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="0.80"/><rect x="18.85" y="81.00" width="1.60" height="26.00" rx="1.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="0.80"/><rect x="19.63" y="81.00" width="2.47" height="26.00" rx="1.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="0.80"/><rect x="22.87" y="81.00" width="2.63" height="26.00" rx="1.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="0.80"/><rect x="60.70" y="81.00" width="1.60" height="26.00" rx="1.0" fill="url(#hatch)" stroke="#eb6834" stroke-width="0.80"/><rect x="92.08" y="81.00" width="5.13" height="26.00" rx="1.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="0.80"/><rect x="105.26" y="81.00" width="30.12" height="26.00" rx="1.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="0.80"/><rect x="235.33" y="81.00" width="23.64" height="26.00" rx="1.0" fill="#2a78d6" stroke="#2a78d6" stroke-width="0.80"/><rect x="258.85" y="81.00" width="3.12" height="26.00" rx="1.0" fill="url(#hatch)" stroke="#eb6834" stroke-width="0.80"/><rect x="400.09" y="81.00" width="17.49" height="26.00" rx="1.0" fill="url(#hatch)" stroke="#eb6834" stroke-width="0.80"/><rect x="417.51" y="81.00" width="2.91" height="26.00" rx="1.0" fill="url(#hatch)" stroke="#eb6834" stroke-width="0.80"/><text x="120.32" y="74.00" font-size="7.0" fill="#0b0b0b" text-anchor="middle" font-weight="bold">9.3 d</text><text x="247.15" y="74.00" font-size="7.0" fill="#0b0b0b" text-anchor="middle" font-weight="bold">7.3 d</text><text x="408.83" y="74.00" font-size="7.0" fill="#0b0b0b" text-anchor="middle" font-weight="bold">5.4 d</text><text x="0.00" y="150.00" font-size="9.0" fill="#0b0b0b" text-anchor="start" font-weight="bold">B</text><text x="11.00" y="150.00" font-size="9.0" fill="#0b0b0b" text-anchor="start" font-weight="bold">Duration — the same 13 on a logarithmic scale</text><rect x="311.91" y="166.00" width="62.83" height="96.00" rx="2.0" fill="#fdeae1" stroke="none" stroke-width="1.00"/><text x="343.33" y="179.00" font-size="6.6" fill="#0b0b0b" text-anchor="middle" font-weight="bold">no interruption</text><text x="343.33" y="188.00" font-size="6.6" fill="#0b0b0b" text-anchor="middle" font-weight="bold">fell in this band</text><line x1="46.46" y1="166.00" x2="46.46" y2="262.00" stroke="#e1e0d9" stroke-width="0.70"/><text x="46.46" y="274.00" font-size="6.8" fill="#898781" text-anchor="middle" font-weight="normal">1 h</text><line x1="93.99" y1="166.00" x2="93.99" y2="262.00" stroke="#e1e0d9" stroke-width="0.70"/><text x="93.99" y="274.00" font-size="6.8" fill="#898781" text-anchor="middle" font-weight="normal">2 h</text><line x1="169.32" y1="166.00" x2="169.32" y2="262.00" stroke="#e1e0d9" stroke-width="0.70"/><text x="169.32" y="274.00" font-size="6.8" fill="#898781" text-anchor="middle" font-weight="normal">6 h</text><line x1="216.85" y1="166.00" x2="216.85" y2="262.00" stroke="#e1e0d9" stroke-width="0.70"/><text x="216.85" y="274.00" font-size="6.8" fill="#898781" text-anchor="middle" font-weight="normal">12 h</text><line x1="264.38" y1="166.00" x2="264.38" y2="262.00" stroke="#e1e0d9" stroke-width="0.70"/><text x="264.38" y="274.00" font-size="6.8" fill="#898781" text-anchor="middle" font-weight="normal">1 day</text><line x1="311.91" y1="166.00" x2="311.91" y2="262.00" stroke="#e1e0d9" stroke-width="0.70"/><text x="311.91" y="274.00" font-size="6.8" fill="#898781" text-anchor="middle" font-weight="normal">2 days</text><line x1="374.74" y1="166.00" x2="374.74" y2="262.00" stroke="#e1e0d9" stroke-width="0.70"/><text x="374.74" y="274.00" font-size="6.8" fill="#898781" text-anchor="middle" font-weight="normal">5 days</text><line x1="422.27" y1="166.00" x2="422.27" y2="262.00" stroke="#e1e0d9" stroke-width="0.70"/><text x="422.27" y="274.00" font-size="6.8" fill="#898781" text-anchor="middle" font-weight="normal">10 days</text><line x1="22.00" y1="262.00" x2="442.00" y2="262.00" stroke="#c3c2b7" stroke-width="0.80"/><circle cx="39.23" cy="250.00" r="4.60" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4"/><circle cx="46.46" cy="238.30" r="4.60" fill="url(#hatch)" stroke="#eb6834" stroke-width="1.4"/><circle cx="97.33" cy="250.00" r="4.60" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4"/><circle cx="152.58" cy="250.00" r="4.60" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4"/><circle cx="155.43" cy="238.30" r="4.60" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4"/><circle cx="245.79" cy="250.00" r="4.60" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4"/><circle cx="250.14" cy="238.30" r="4.60" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4"/><circle cx="257.16" cy="250.00" r="4.60" fill="url(#hatch)" stroke="#eb6834" stroke-width="1.4"/><circle cx="261.76" cy="238.30" r="4.60" fill="url(#hatch)" stroke="#eb6834" stroke-width="1.4"/><circle cx="295.89" cy="250.00" r="4.60" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4"/><circle cx="380.02" cy="250.00" r="4.60" fill="url(#hatch)" stroke="#eb6834" stroke-width="1.4"/><circle cx="400.69" cy="250.00" r="4.60" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4"/><circle cx="417.30" cy="250.00" r="4.60" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.4"/><text x="22.00" y="288.00" font-size="7.2" fill="#52514e" text-anchor="start" font-weight="normal">9 interruptions under 24 hours   ·   1 at 38 hours   ·   0 between 2 and 5 days   ·   3 at 5 days and over</text><text x="22.00" y="299.00" font-size="7.2" fill="#52514e" text-anchor="start" font-weight="normal">A missed wake leaves the next-startup alarm in the past and nothing re-arms it, so an interruption either</text><text x="22.00" y="309.00" font-size="7.2" fill="#52514e" text-anchor="start" font-weight="normal">clears within a day or runs until something external restarts the station.</text></svg>
