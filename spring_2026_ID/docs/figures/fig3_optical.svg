<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 344" width="468" height="344" role="img" aria-labelledby="figtitle figdesc" font-family="system-ui,-apple-system,'Segoe UI','DejaVu Sans','Liberation Sans',Helvetica,Arial,sans-serif"><title id="figtitle">Optical water-level detection at Sukabumi, 8 to 14 July 2026</title><desc id="figdesc">Two panels, from 200 sampled captures. The upper panel counts captures by hour of day, split into those that produced a water level and those rejected at the quality gate. Every rejection falls between 06:00 and 19:00; there are none at night. Within daylight the rejections peak in mid-morning and again in mid-afternoon, with a dip in the early afternoon. The lower panel shows the signal-to-noise ratio of all 200 captures against the gate of 2.0. The rejected captures sit below the gate with a median of 1.63; the accepted ones spread above it with a median of 4.01, though 36 of the 100 fall between 2.0 and 3.0, close to the gate.</desc><rect width="100%" height="100%" fill="#ffffff"/><defs><pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" fill="#fdeae1"/><line x1="0" y1="0" x2="0" y2="4" stroke="#eb6834" stroke-width="1.6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#52514e"/></marker></defs><text x="0.00" y="14.00" font-size="10.0" fill="#0b0b0b" text-anchor="start" font-weight="bold">Figure 3  Optical water-level detection, 8 to 14 July 2026</text><text x="0.00" y="28.00" font-size="8.0" fill="#52514e" text-anchor="start" font-weight="normal">200 sampled captures. Each rejection costs the whole discharge measurement, not only the water level.</text><rect x="0.00" y="35.00" width="9.00" height="9.00" rx="1.5" fill="#2a78d6" stroke="none" stroke-width="1.00"/><text x="13.00" y="42.00" font-size="7.5" fill="#0b0b0b" text-anchor="