# orccapture.conf — ship orc-capture's own verdict with the sensor upload
#
# WHY THIS EXISTS (ISS-FIELD-010)
#   "No daytime video" turned out to be two different failures. At midday the
#   station wakes, finishes fast and produces nothing; in the evening it hangs
#   for the full Witty Pi ON window. Those need opposite fixes, and both are
#   already described in orc-capture's log — which lives only in the station's
#   journal and has never been readable without an SSH window we cannot win.
#
#   So the outcome rides the sensor upload, the one path that demonstrably
#   works when SSH does not. Same argument as the Witty Pi power-on reason.
#
#   The codes answer the question directly:
#     4 camera-unreachable   the camera did not come up   -> power or PoE
#     6 quality-gate-failed  it did, and the picture was rejected -> exposure/profile
#     2 disabled-via-orc-os  CAPTURE_ENABLED=0            -> configuration
#     3 maintenance-skip     the maintenance flag was set -> mode left on
#     5 all-attempts-failed  three tries, nothing delivered
#     1 delivered            worked
#    -1 no orc-capture run found in the journal tail
#    -2 journal not readable by the service user
#
#   capture_gate_code narrows a rejection further: empty/corrupt means the
#   camera barely answered, bitrate/resolution means it answered badly. That is
#   the difference between a power fault and an image-profile fault.
#
# Location: /etc/orc-sensors/orccapture.conf

# ─── Sensor identity ────────────────────────────────────────────────
SENSOR_TYPE=orccapture
SENSOR_LABEL=orccapture

# ─── Output ─────────────────────────────────────────────────────────
LOG_DIR=/var/log/orc/sensors
LOG_ROTATE_DAYS=30
CSV_HEADER=timestamp,capture_result_code,capture_result,capture_gate_code,capture_gate,capture_attempts,capture_age_s

# ─── Source ─────────────────────────────────────────────────────────
# The unit is created by ORC-OS, so this repo does not own the name. The driver
# falls back to the syslog identifier, which the script's own log() prefix
# makes stable regardless of what the unit ends up called.
CAPTURE_UNIT=orc-capture.service
CAPTURE_IDENT=orc-capture
JOURNAL_LINES=300
READ_TIMEOUT_SEC=10

# ─── Timing ─────────────────────────────────────────────────────────
# 0 = every orc-sensors tick. The value only changes once per wake, so repeats
# are redundant but harmless — the server dedupes on (ts, station, sensor,
# metric) — and a repeat is what makes the row survive if one tick's upload is
# the one that gets through.
INTERVAL_SEC=0
