# wittypi.conf — Witty Pi 5 power rail logging (ISS-FIELD-008 / TODO-116)
#
# Logs input voltage, output voltage and output current so the overnight
# battery behaviour becomes visible on the server instead of being inferred
# from missing rows.
#
# The station is a 12 V LiFePO4 pack. The competing explanations for the
# overnight brownouts — a worn pack, a BMS tripping early on cell imbalance,
# a low-voltage cutoff set for the wrong chemistry, or an unbudgeted parasitic
# load — all predict different Vin curves:
#
#   sits ~13.0-13.2 V then vanishes abruptly   -> BMS disconnect (imbalance)
#   slides 12.9 -> 12.5 V through the knee     -> genuine capacity exhaustion
#   still above ~12.9 V when the Pi cuts       -> cutoff misconfigured
#   falls fast between wakes, Pi asleep        -> parasitic load
#
# Location: /etc/orc-sensors/wittypi.conf

# ─── Sensor identity ────────────────────────────────────────────────
SENSOR_TYPE=wittypi                   # sensor driver (must match a handler)
SENSOR_LABEL=wittypi                  # prefix for CSV filenames

# ─── Output ─────────────────────────────────────────────────────────
LOG_DIR=/var/log/orc/sensors          # directory for daily CSV files
LOG_ROTATE_DAYS=30                    # delete CSVs older than this
CSV_HEADER=timestamp,vin_v,vin_min_v,vin_max_v,vout_v,iout_a,iout_min_a,iout_max_a,vin_at_imin_v,vin_at_imax_v,samples_n,samples_paired_n,power_on_reason_code,power_on_reason,prev_shutdown_reason_code,prev_shutdown_reason,downtime_s,boot_age_s

# ─── Witty Pi boot context (ISS-FIELD-010) ──────────────────────────
# Path to the Witty Pi daemon log that names the power-on reason. Confirmed as
# /var/log/wp5d.log by the 2026-08-27 station capture — the wittyPi.log path
# the vendor docs use does not exist on this install.
#
# The *_reason columns are text and will not parse as a float, so the server's
# ingest silently skips them (sensor-ingest/app.py) and only the *_code columns
# reach Grafana. That is intended: the code is queryable, and the raw text stays
# in the CSV on the server for the case a code comes back 0 = unrecognised.
WP5D_LOG=/var/log/wp5d.log

# ─── Timing ─────────────────────────────────────────────────────────
# 0 = read on every orc-sensors tick. The Pi is awake roughly two minutes in
# every thirty, so this yields ~2 samples per wake and ~48 waking samples a
# day. Anything larger would skip whole wakes and lose the shape of the
# overnight curve, which is the entire point.
INTERVAL_SEC=0

# ─── Sampling ───────────────────────────────────────────────────────
# A short burst inside one invocation. The camera and PoE injector switch on
# partway through the wake, and that load step is the widest lever arm
# available for an effective source resistance — the number that separates a
# bad connection (ohms: fuse holder, terminal, crimp) from a worn pack
# (milliohms). See TODO-117 and read_wittypi()'s docstring.
#
# THE OLD COST MODEL WAS STALE. This block used to say "wp5 never exits on its
# own ... so every read costs the full timeout", and bounded SAMPLES at 2 for
# ~12 s per tick. That stopped being true when _wp5_sample started feeding wp5
# Exit — it now terminates cleanly and a read costs well under a second.
# Measured 2026-08-28: sht40 logged at 04:30:26, wittypi at 04:30:27, with two
# samples and a mandatory 1.0 s gap between them. The budget was pessimistic by
# roughly 10x, and the sample count that mattered for the fit paid for it.
#
# 6 samples at 2.0 s spans ~10 s per tick — still inside the old budget, six
# paired points instead of one unusable pair, and wide enough in wall time to
# have a chance of straddling the camera switch-on rather than landing entirely
# before or after it. The 30-minute cadence still supplies the overnight curve.
SAMPLES=6
SAMPLE_GAP_SEC=2.0
READ_TIMEOUT_SEC=6
