# orc-wp5-rearm — which Witty Pi schedule script to re-activate on every boot
#
# Must match a file name in the Witty Pi's schedule directory, as listed by
# wp5 option 6. Re-activating restarts the firmware's 42.6-day schedule list
# (TODO-116). If you load a different script on the Witty Pi by hand (for
# example maint.wpi), change this too, or the next boot will switch it back.
# Empty disables re-arming.
#
# Location: /etc/orc-wp5-rearm.conf

SCHEDULE_SCRIPT=prod_30.wpi
